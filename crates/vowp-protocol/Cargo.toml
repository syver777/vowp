[package]
name = "vowp-protocol"
description = "VOWP protocol types for events, capsules, jobs, gates, profiles and configuration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/vowp-protocol"
readme = "README.md"
keywords = ["vowp", "protocol", "types", "serde", "schema"]
categories = ["development-tools", "encoding", "config", "data-structures", "artificial-intelligence"]
include = ["src/**", "README.md", "Cargo.toml"]

[dependencies]
globset = "0.4.19"
regex = "1.13.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "formatting", "parsing", "macros"] }
toml = "1.2.1"
ulid = { version = "3.0.0", features = ["serde"] }

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.11.0"
