[package]
name = "vowp-agent"
description = "Mac-side v0.4 local agent: config, node key, transport and frame client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/vowp-agent"
readme = "README.md"
keywords = ["vowp", "agent", "ssh", "ed25519", "orchestrator"]
categories = ["development-tools", "command-line-utilities", "network-programming"]
include = ["src/**", "Cargo.toml", "README.md"]

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4.3"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = "0.3.45"
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
vowp-protocol = { version = "0.5.1-dev", path = "../vowp-protocol" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
rcgen = "0.14.7"
tempfile = "3.27.0"
